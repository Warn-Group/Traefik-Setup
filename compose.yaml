services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    environment:
      CONTAINERS: 1
      SERVICES: 1
      TASKS: 1
      NETWORKS: 1
      NODES: 1
      INFO: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket-proxy
    deploy:
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 64M
      placement:
        constraints:
          - node.role == manager

  reverse-proxy:
    image: traefik:v3.7
    env_file:
      - cloudflare.env
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: udp
        mode: host
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - socket-proxy
      - traefik-bridge
    volumes:
      - ./traefik.yaml:/etc/traefik/traefik.yaml:ro
      - ./logs:/etc/traefik/logs:rw
      - ./acme:/etc/traefik/acme:rw
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        - traefik.http.services.traefik.loadbalancer.server.port=8080
        - traefik.http.routers.dashboard.rule=Host(`traefik.local`)
        - traefik.http.routers.dashboard.entrypoints=web,websecure
        - traefik.http.routers.dashboard.tls=true
        - traefik.http.routers.dashboard.service=api@internal
        - traefik.http.routers.dashboard.middlewares=localnetwork@file

networks:
  socket-proxy:
    driver: overlay
    internal: true
  traefik-bridge:
    external: true
