global:
  checkNewVersion: true
  sendAnonymousUsage: false

log:
  level: INFO
  format: common
  filePath: /etc/traefik/logs/traefik.log

accessLog:
  format: common
  filePath: /etc/traefik/logs/access.log
  bufferingSize: 4096

entryPoints:
  web:
    address: ":10080"
    forwardedHeaders:
      trustedIPs: &trustedCloudflareIPs
      # https://www.cloudflare.com/ips/
      - "173.245.48.0/20"
      - "103.21.244.0/22"
      - "103.22.200.0/22"
      - "103.31.4.0/22"
      - "141.101.64.0/18"
      - "108.162.192.0/18"
      - "190.93.240.0/20"
      - "188.114.96.0/20"
      - "197.234.240.0/22"
      - "198.41.128.0/17"
      - "162.158.0.0/15"
      - "104.16.0.0/13"
      - "104.24.0.0/14"
      - "172.64.0.0/13"
      - "131.0.72.0/22"
      - "2400:cb00::/32"
      - "2606:4700::/32"
      - "2803:f800::/32"
      - "2405:b500::/32"
      - "2405:8100::/32"
      - "2a06:98c0::/29"
      - "2c0f:f248::/32"

  websecure:
    address: ":10443"
    forwardedHeaders:
      trustedIPs: *trustedCloudflareIPs
    http3:
      advertisedPort: 443

  ping:
    address: ":8082"

api:
  dashboard: true
  insecure: false
  disableDashboardAd: true

ping:
  entryPoint: ping

http:
  middlewares:
    localnetwork:
      ipAllowList:
        sourceRange:
          - "127.0.0.1/32"
          - "::1/128"
          - "192.168.0.0/16"
          - "fd00::/8"
        ipStrategy:
          depth: 0

    ratelimit:
      rateLimit:
        average: 100
        period: 1s
        burst: 50

    httpsredirect:
      redirectScheme:
        scheme: https
        permanent: true

    cloudflareonly:
      ipAllowList:
        sourceRange: *trustedCloudflareIPs
        ipStrategy:
          depth: 0

  serversTransports:
    insecureskip:
      insecureSkipVerify: true


certificatesResolvers:
  cloudflare:
    acme:
      email: ops@warn.group
      storage: /etc/traefik/acme/cloudflare.json
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"
          - "1.0.0.1:53"
  tlschallenge:
    acme:
      email: ops@warn.group
      storage: /etc/traefik/acme/tls.json
      tlsChallenge: {}
  staging:
    acme:
      email: ops@warn.group
      storage: /etc/traefik/acme/staging.json
      caServer: https://acme-staging-v02.api.letsencrypt.org/directory
      httpChallenge:
        entryPoint: web

providers:
  # https://doc.traefik.io/traefik/reference/install-configuration/providers/swarm/
  swarm:
    endpoint: "tcp://socket-proxy:2375"
    exposedByDefault: false
    network: traefik-bridge
    watch: true
  # https://doc.traefik.io/traefik/reference/install-configuration/providers/docker/
  docker:
    endpoint: "tcp://socket-proxy:2375"
    exposedByDefault: false
    network: traefik-bridge
    watch: true
  # https://doc.traefik.io/traefik/reference/install-configuration/providers/others/file/
  file:
    filename: /etc/traefik/traefik.yaml
    watch: true